name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  deterministic-mvp:
    name: Deterministic MVP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONPATH: src
      DEEPRESEARCH_MODE: deterministic
      DEEPRESEARCH_SEARCH_PROVIDER: fixture
      DEEPRESEARCH_STRUCTURED_DATA_PROVIDER: fixture
      DEEPRESEARCH_STORAGE_PATH: artifacts/ci_runtime/research.db
      DEEPRESEARCH_RUNS_ROOT: artifacts/ci_runtime/runs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run deterministic CI gate
        run: python scripts/gate.py
