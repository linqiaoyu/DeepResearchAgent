name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  deterministic-mvp:
    name: Deterministic MVP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONPATH: src
      DEEPRESEARCH_MODE: deterministic
      DEEPRESEARCH_SEARCH_PROVIDER: fixture
      DEEPRESEARCH_STRUCTURED_DATA_PROVIDER: fixture
      DEEPRESEARCH_STORAGE_PATH: artifacts/ci_runtime/research.db
      DEEPRESEARCH_RUNS_ROOT: artifacts/ci_runtime/runs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check src tests scripts

      - name: Check documented Settings defaults
        run: python scripts/sync_agents_settings.py --check

      - name: Check prompt drift registry
        run: python scripts/check_prompt_drift.py

      - name: Run unittest suite
        run: python -m unittest discover -s tests

      - name: Run deterministic demo smoke
        run: python scripts/run_demo.py --output artifacts/ci_demo/report.md

      - name: Run deterministic eval smoke
        run: python scripts/run_eval.py --limit 5 --compare-baseline --baseline-path data/eval_baseline_v2.json --output artifacts/ci_eval/latest_metrics.json

      - name: Ensure tracked files are unchanged
        run: git diff --exit-code
