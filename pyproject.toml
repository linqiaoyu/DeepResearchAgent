[project]
name = "deepresearch-agent"
version = "0.1.0"
description = "A multi-agent deep research framework with evidence tracking, critic feedback, checkpointing, and evaluation harness."
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.13.4",
  "fastapi==0.136.3",
  "uvicorn[standard]==0.48.0",
  "langgraph==1.2.2",
  "langgraph-checkpoint-sqlite==3.1.0",
  "langgraph-checkpoint-postgres==3.1.0",
  "litellm==1.86.2",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "pypdf==6.14.2",
  "pdfplumber==0.11.10",
  "psycopg[binary]==3.3.4",
]

[project.optional-dependencies]
finance = [
  "akshare==1.18.64",
]
ui = [
  "streamlit==1.58.0",
]
dev = [
  "ruff==0.15.15",
  "mypy==1.18.2",
]

[project.scripts]
deepresearch-demo = "deepresearch_agent.cli:run_demo"
deepresearch-eval = "deepresearch_agent.cli:run_eval"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
# R112 scoped this deliberately. The three storage/domain defects that round
# found -- a Postgres store inheriting SQLite's __init__ without calling it, a
# protocol method dropped from one implementation, a shared row shape that had
# drifted -- are all things a type checker sees and Ruff does not. Running it
# across 35k lines at once would have meant either a huge suppression list or
# nothing at all, so it starts strict on the surfaces where implementations must
# agree, and the file list is a ratchet: it may only grow.
files = [
  "src/deepresearch_agent/storage",
  "src/deepresearch_agent/domains/protocols.py",
  "src/deepresearch_agent/domains/base.py",
  "src/deepresearch_agent/domains/registry.py",
  "src/deepresearch_agent/rag/ingest.py",
]
strict = true
warn_unused_ignores = true
warn_unreachable = true
# Resolve types through the rest of the package, but only report on the files
# above. Without this the ratchet is not a ratchet -- it becomes a 35k-line
# check that has to be silenced somewhere.
follow_imports = "silent"

[[tool.mypy.overrides]]
# psycopg is imported lazily inside PostgresStore so the SQLite-only path does
# not require the driver; the handle is deliberately untyped.
module = ["psycopg.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"deepresearch_agent.domains.finance" = { msg = "core must not import a concrete domain; inject DomainPack instead" }

[tool.ruff.lint.per-file-ignores]
# Script entrypoints prepend src/ for local checkout bootstrap before importing package modules.
"scripts/dev_server.py" = ["E402"]
"scripts/run_checkpoint_demo.py" = ["E402"]
"scripts/run_demo.py" = ["E402"]
"scripts/run_eval.py" = ["E402"]
# A concrete implementation may reference its own package; the registry is the
# explicit composition root. Domain protocols/base/null remain protected.
"src/deepresearch_agent/domains/finance/**" = ["TID251"]
"src/deepresearch_agent/domains/registry.py" = ["TID251"]
# Build and migration tools for the finance corpus, not core. They resolve SEC
# EDGAR filing dates, which is finance-registry knowledge by definition; the
# agent core never imports them, and check_domain_boundary.py measures core
# separately.
"scripts/build_corpus_v3.py" = ["TID251"]
"scripts/backfill_disclosure_dates.py" = ["TID251"]
# This characterization test verifies the concrete finance renderer itself;
# new tests must use an injected pack instead.
"tests/unit/test_reader_fidelity.py" = ["TID251"]
# Characterization contract for the finance-only guardrail implementation.
"tests/unit/test_core_guardrail.py" = ["TID251"]
# Tests the SEC EDGAR disclosure-date provider, which lives in the finance
# domain because a filing registry is finance-registry knowledge. Core never
# imports it; only the corpus build tool and this test do.
"tests/unit/test_disclosure_dates.py" = ["TID251"]
